<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body {
    margin: 0; width: 1200px; height: 630px;
    background: #08080a; color: #fff; overflow: hidden;
    font-family: -apple-system, "SF Pro Display", sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .logo {
    position: absolute; top: 52px; left: 64px;
    display: flex; align-items: center; gap: 20px;
    font-size: 34px; font-weight: 900; letter-spacing: -1px;
  }
  .sigma {
    width: 84px; height: 84px; border-radius: 22px;
    background: #ff6b1f; display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 900;
  }
  h1 {
    font-size: 92px; font-weight: 900; line-height: 1;
    letter-spacing: -4px; margin: 0; padding: 0 64px;
  }
  .accent { color: #ff6b1f; }
  .sub {
    position: absolute; bottom: 58px; left: 64px;
    font-size: 26px; color: #a1a1a8; font-weight: 500;
  }
  .deco { position: absolute; font-family: Georgia, serif; color: #ff6b1f; opacity: .12; line-height: 1; }
  .d1 { font-size: 380px; top: -60px; right: -30px; transform: rotate(-10deg); }
  .d2 { font-size: 160px; bottom: 40px; right: 70px; }
</style></head>
<body>
  <div class="logo"><div class="sigma">∑</div>MathTest</div>
  <h1>Конструктор<br>контрольных по <span class="accent">математике</span></h1>
  <div class="sub">Автопроверка формул · Классы · Библиотека · Бесплатно</div>
  <span class="deco d1">∫</span>
  <span class="deco d2">√</span>
</body></html>
